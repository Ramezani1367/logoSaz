name: Build Logo Color Studio for Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for the build machine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build the standalone Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name LogoColorStudio --add-data "index.html;." --add-data "samples;samples" --collect-all resvg_py --collect-all PIL --hidden-import pythoncom --hidden-import pywintypes --collect-submodules win32com app.py

      - name: Package executable and Persian guide
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LogoColorStudio.exe", "README_FA.txt" -DestinationPath "LogoColorStudio-Windows.zip" -Force

      - name: Upload the Windows app
        uses: actions/upload-artifact@v4
        with:
          name: LogoColorStudio-Windows
          path: LogoColorStudio-Windows.zip
          if-no-files-found: error
          retention-days: 30
